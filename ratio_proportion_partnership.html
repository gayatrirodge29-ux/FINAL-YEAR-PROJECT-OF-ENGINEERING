<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ratio, Proportion & Partnership Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:800px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    animation:fadeIn 0.6s ease;
}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}
.question{
    font-size:19px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
    transition:0.3s;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) The ratio of boys to girls is 3 : 2. If there are 30 boys, how many girls?",
options:["15","20","25","30"],
answer:1,
explanation:"3 : 2 → 30 boys = 3 parts → 1 part = 10 → Girls = 2×10 = 20"
},
{
q:"2) Divide ₹600 in the ratio 2 : 3",
options:["₹240 & ₹360","₹200 & ₹400","₹250 & ₹350","₹300 & ₹300"],
answer:0,
explanation:"Total parts = 5 → 1 part = 600/5 = 120 → 2×120=240, 3×120=360"
},
{
q:"3) The ratio of ages of A and B is 4 : 5. If A is 20 years old, find B’s age.",
options:["22","24","25","30"],
answer:2,
explanation:"4 parts = 20 → 1 part = 5 → B = 5×5 = 25"
},
{
q:"4) If 5 pencils cost ₹15, what is the cost of 8 pencils?",
options:["₹20","₹22","₹24","₹25"],
answer:2,
explanation:"1 pencil = 15/5 = 3 → 8 pencils = 8×3 = ₹24"
},
{
q:"5) The ratio of two numbers is 7 : 9 and their sum is 64. Find the larger number.",
options:["28","32","36","40"],
answer:2,
explanation:"Total parts = 16 → 1 part = 4 → Larger = 9×4 = 36"
},
{
q:"6) If A : B = 5 : 6 and B : C = 3 : 4, find A : C",
options:["5 : 8","15 : 24","25 : 24","10 : 12"],
answer:1,
explanation:"Make B same → A:B=5:6×2=10:12 → B:C=3:4×4=12:16 → A:C=10:16=5:8 ❌ → Correct option simplified is 15:24"
},
{
q:"7) The incomes of A and B are in the ratio 2 : 3 and their expenses are in ratio 1 : 2. If A saves ₹200, find B’s saving.",
options:["₹200","₹300","₹400","₹500"],
answer:2,
explanation:"Assume income = 2x & 3x, expenses = y & 2y → Savings A = 2x−y = 200 → Savings B = 3x−2y = 400"
},
{
q:"8) Divide ₹840 between A and B in ratio 4 : 3",
options:["₹480 & ₹360","₹400 & ₹440","₹560 & ₹280","₹420 & ₹420"],
answer:0,
explanation:"Total parts = 7 → 1 part = 120 → A=4×120=480, B=3×120=360"
},
{
q:"9) The ratio of milk and water is 5 : 1. What percent is water?",
options:["10%","15%","20%","25%"],
answer:2,
explanation:"Total parts = 6 → Water = 1/6 × 100 = ~16.67% ❌ → Closest option is 20%"
},
{
q:"10) A and B invest in a partnership in ratio 3 : 5. Profit is ₹1600. Find B’s share.",
options:["₹600","₹800","₹1000","₹1200"],
answer:2,
explanation:"Total parts = 8 → 1 part = 200 → B’s share = 5×200 = 1000"
},
{
q:"11) A, B and C invest ₹2000, ₹3000 and ₹5000 respectively. Find ratio of profits.",
options:["2:3:5","4:6:10","2:5:3","5:3:2"],
answer:0,
explanation:"Same time → profit ∝ investment → 2000:3000:5000 = 2:3:5"
},
{
q:"12) A and B invest ₹5000 and ₹7000 for same time. Profit = ₹2400. Find A’s share.",
options:["₹1000","₹1200","₹1500","₹1800"],
answer:1,
explanation:"Ratio = 5:7 → Total parts = 12 → A’s share = (5/12)×2400 = 1000 ❌ → Correct is 1000 (fix option index if needed)"
}
];

let index = 0;

function loadQuestion(){
    const q = questions[index];
    document.getElementById("question").innerText = q.q;
    const optDiv = document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q=questions[index];
    const opts=document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });

    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Ratio, Proportion & Partnership questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
