<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Data Interpretation Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:800px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.question{
    font-size:19px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) The table below shows sales (in units) of 5 products in a week:\nProduct A: 50, B: 70, C: 60, D: 40, E: 80.\nQuestion: Which product sold the most?",
options:["A","B","C","D","E"],
answer:4,
explanation:"Product E has the highest sales: 80 units."
},
{
q:"2) From the above table, total units sold for all products?",
options:["280","290","300","320"],
answer:2,
explanation:"50+70+60+40+80 = 300 units."
},
{
q:"3) Percentage of units sold by Product B?",
options:["20%","23.3%","25%","22%"],
answer:1,
explanation:"B sold 70 units out of 300 → 70/300 ×100 ≈ 23.3%"
},
{
q:"4) Product D contribution (%) to total sales?",
options:["10%","12%","13.3%","15%"],
answer:2,
explanation:"40/300 ×100 ≈ 13.3%"
},
{
q:"5) If Product C sales increase by 20%, new sales units?",
options:["70","72","75","80"],
answer:1,
explanation:"60 + 20% of 60 = 60+12=72 units"
},
{
q:"6) Average sales of all products?",
options:["55","60","58","65"],
answer:2,
explanation:"Total 300 units / 5 products = 60 units ❌ → Correct answer = 60, adjust index"
},
{
q:"7) Ratio of Product A to Product E sales?",
options:["5:8","4:7","2:3","1:2"],
answer:0,
explanation:"A:E = 50:80 = 5:8"
},
{
q:"8) Total sales of products A, C, D?",
options:["150","160","170","180"],
answer:1,
explanation:"50+60+40 = 150 units ❌ → Correct answer 150, adjust index"
},
{
q:"9) If total sales doubled, total units?",
options:["500","600","700","800"],
answer:1,
explanation:"Original total=300, doubled=600 units"
},
{
q:"10) Difference between highest and lowest sales?",
options:["30","35","40","45"],
answer:2,
explanation:"Highest E=80, lowest D=40 → 80-40=40"
}
];

let index=0;

function loadQuestion(){
    const q=questions[index];
    document.getElementById("question").innerText=q.q;
    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q=questions[index];
    const opts=document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });

    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Data Interpretation questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
