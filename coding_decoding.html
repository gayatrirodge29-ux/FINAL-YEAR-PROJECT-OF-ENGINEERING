<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Coding Decoding Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:820px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    animation:fadeIn 0.6s ease;
}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}
.question{
    font-size:18px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
    transition:0.3s;
}
.option:hover{ background:#f1f5f9; }
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) If CAT is coded as DBU, then DOG is coded as?",
options:["EPH","EOH","DPI","FPH"],
answer:0,
explanation:"Each letter moves +1 → C→D, A→B, T→U → DOG → EPH"
},
{
q:"2) If APPLE is written as BQQMF, how is ORANGE written?",
options:["PSBOHF","QTBMHF","PSBNHF","PRBOHF"],
answer:0,
explanation:"Each letter is shifted +1 → O→P, R→S, A→B, N→O, G→H, E→F"
},
{
q:"3) If 123 is coded as 246, how is 456 coded?",
options:["8912","81012","8910","810"],
answer:2,
explanation:"Each digit ×2 → 4×2=8,5×2=10,6×2=12 → 8 10 12 → 8910"
},
{
q:"4) If PEN = QFO, then BOOK = ?",
options:["CPPL","CPPJ","CPPK","CPQL"],
answer:0,
explanation:"Each letter +1 → B→C, O→P, O→P, K→L"
},
{
q:"5) If LION is coded as KHMN, then TIGER is coded as?",
options:["SHFDQ","SHFDS","SIFDS","SJGDS"],
answer:0,
explanation:"Each letter −1 → T→S, I→H, G→F, E→D, R→Q"
},
{
q:"6) If MONDAY is written as 123456, what is DAY?",
options:["456","345","234","156"],
answer:0,
explanation:"M=1,O=2,N=3,D=4,A=5,Y=6 → DAY = 456"
},
{
q:"7) If 2 = A, 4 = B, 6 = C, then 10 = ?",
options:["D","E","F","G"],
answer:1,
explanation:"Even numbers mapping → 2:A,4:B,6:C,8:D,10:E"
},
{
q:"8) If GOLD is coded as 7-15-12-4, then SILVER is coded as?",
options:[
"19-9-12-22-5-18",
"18-9-12-22-5-18",
"19-8-12-22-5-18",
"19-9-11-22-5-18"
],
answer:0,
explanation:"Alphabet positions → S(19),I(9),L(12),V(22),E(5),R(18)"
},
{
q:"9) If A=1, B=3, C=5, then D=?",
options:["6","7","8","9"],
answer:1,
explanation:"Odd numbers sequence → A=1,B=3,C=5,D=7"
},
{
q:"10) If TRAIN is coded as UQBJO, then PLANE is coded as?",
options:["QMBPF","QMBNF","PMBOF","QMBPE"],
answer:0,
explanation:"Each letter +1 → P→Q, L→M, A→B, N→O, E→F"
}
];

let index=0;

function loadQuestion(){
    const q=questions[index];
    document.getElementById("question").innerText=q.q;
    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q=questions[index];
    const opts=document.querySelectorAll(".option");
    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });
    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display = e.style.display==="none" ? "block" : "none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You have completed Coding–Decoding questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
