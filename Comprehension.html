<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Reading Comprehension Quiz</title>

<style>
body{
    margin:0;
    min-height:100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#ffffff;
    max-width:1000px;
    width:100%;
    padding:25px;
    border-radius:14px;
    box-shadow:0 15px 30px rgba(0,0,0,0.3);
}
.passage{
    font-size:16px;
    line-height:1.7;
    margin-bottom:20px;
    background:#f8fafc;
    padding:15px;
    border-radius:8px;
}
.question{
    font-size:18px;
    font-weight:bold;
    margin-bottom:15px;
}
.option{
    padding:12px;
    border:2px solid #e5e7eb;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{background:#f9fafb;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:12px;
}
#prevBtn{background:#f59e0b;color:#fff;}
#nextBtn{background:#16a34a;color:#fff;display:none;}
#explainBtn{background:#2563eb;color:#fff;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f1f5f9;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">

    <div class="passage" id="passage"></div>

    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const passageText =
"Education plays a vital role in shaping an individual's future. It not only provides knowledge but also develops critical thinking and problem-solving skills. Educated individuals are more likely to make informed decisions, contribute positively to society, and lead a disciplined life. In today’s competitive world, education has become a necessity rather than a luxury.";

const questions = [
{
q:"1) What is the main role of education according to the passage?",
options:[
    "Providing wealth",
    "Shaping an individual’s future",
    "Making people famous",
    "Ensuring job security"
],
answer:1,
explanation:"The passage clearly states that education plays a vital role in shaping an individual's future."
},
{
q:"2) Education helps in developing which of the following skills?",
options:[
    "Physical strength",
    "Artistic skills only",
    "Critical thinking and problem-solving",
    "Sports skills"
],
answer:2,
explanation:"The passage mentions critical thinking and problem-solving skills."
},
{
q:"3) Educated individuals are more likely to:",
options:[
    "Avoid responsibilities",
    "Make informed decisions",
    "Live carelessly",
    "Ignore society"
],
answer:1,
explanation:"The passage says educated individuals make informed decisions."
},
{
q:"4) According to the passage, education today is considered:",
options:[
    "A luxury",
    "Optional",
    "Unnecessary",
    "A necessity"
],
answer:3,
explanation:"The last line states education has become a necessity rather than a luxury."
},
{
q:"5) Which of the following best describes the tone of the passage?",
options:[
    "Critical",
    "Humorous",
    "Informative",
    "Sarcastic"
],
answer:2,
explanation:"The passage provides factual information about the importance of education."
}
];

let index = 0;

function loadQuestion(){
    document.getElementById("passage").innerText = passageText;
    const q = questions[index];
    document.getElementById("question").innerText = q.q;

    const optDiv = document.getElementById("options");
    optDiv.innerHTML = "";

    document.getElementById("explanation").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("explainBtn").style.display = "none";
    document.getElementById("prevBtn").disabled = index === 0;

    q.options.forEach((opt,i)=>{
        const d = document.createElement("div");
        d.className = "option";
        d.innerText = opt;
        d.onclick = ()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q = questions[index];
    const opts = document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick = null;
        if(idx === q.answer) o.classList.add("correct");
    });

    if(i !== q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText = q.explanation;
    document.getElementById("nextBtn").style.display = "inline-block";
    document.getElementById("explainBtn").style.display = "inline-block";
}

function toggleExplanation(){
    const e = document.getElementById("explanation");
    e.style.display = e.style.display === "none" ? "block" : "none";
}

function nextQuestion(){
    index++;
    if(index < questions.length){
        loadQuestion();
    } else {
        document.getElementById("card").innerHTML =
        "<h2>🎉 Reading Comprehension Completed!</h2><p>You have finished the RC test.</p>";
    }
}

function prevQuestion(){
    if(index > 0){
        index--;
        loadQuestion();
    }
}

loadQuestion();
</script>

</body>
</html>
