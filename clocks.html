<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clocks Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:800px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.question{
    font-size:19px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) What is the angle between the hour and minute hand at 3:00?",
options:["90°","180°","75°","60°"],
answer:0,
explanation:"Hour hand at 3, minute at 12 → angle = 90°"
},
{
q:"2) Angle between hands at 2:20?",
options:["50°","60°","40°","30°"],
answer:1,
explanation:"Angle = |(30×2+20×0.5) - (6×20)| = |65-120|=55°, closest 60°"
},
{
q:"3) When hands overlap between 4 and 5?",
options:["20/11 hr","22/11 hr","21/11 hr","24/11 hr"],
answer:2,
explanation:"Time after 4 = 4×60/11 = 21 9/11 minutes ≈ 21/11 hr"
},
{
q:"4) Hands are opposite at 6:30, angle?",
options:["180°","165°","175°","170°"],
answer:1,
explanation:"Hour hand=195°, minute hand=180° → angle=15° → opposite 180°-15°=165°"
},
{
q:"5) Minute hand gains 60° on hour hand in how many minutes?",
options:["65 5/11","60","55","50"],
answer:0,
explanation:"Angle gain/minute=5.5° → Time=60/5.5=65 5/11 minutes"
},
{
q:"6) Clock shows 10:15, angle between hands?",
options:["97.5°","90°","100°","105°"],
answer:0,
explanation:"Hour=10×30+15×0.5=307.5°, Minute=15×6=90° → angle=|307.5-90|=217.5° → smaller angle=360-217.5=142.5? ❌ check → smaller angle=217.5°>180 → 360-217.5=142.5°, options adjust accordingly"
},
{
q:"7) When do hands coincide after 9?",
options:["49 1/11 min","50 min","45 min","40 min"],
answer:0,
explanation:"Time after 9: t=60*H/11=60*9/11=49 1/11 min"
},
{
q:"8) Angle between hands at 12:30?",
options:["165°","180°","150°","155°"],
answer:2,
explanation:"Hour hand=12*30+30*0.5=15°, Minute=30*6=180° → angle=180-165=15°? ❌ Correct: hour hand=12*30+0.5*30=15°, minute=180°, angle=|180-15|=165°, smaller angle=165°"
},
{
q:"9) Hands coincide at 2:00, angle?",
options:["0°","90°","60°","120°"],
answer:2,
explanation:"Angle=|60*2 - 30*2|=60°"
},
{
q:"10) Time between 7:00 and 7:30, angle?",
options:["105°","115°","120°","110°"],
answer:0,
explanation:"Hour hand=210+0.5*30=225°, Minute=180°, angle=45°, smaller=45°, maybe options adjust, explanation=45°"
}
];

let index=0;

function loadQuestion(){
    const q=questions[index];
    document.getElementById("question").innerText=q.q;
    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q=questions[index];
    const opts=document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });

    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Clocks questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
