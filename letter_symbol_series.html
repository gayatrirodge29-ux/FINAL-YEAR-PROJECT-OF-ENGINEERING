<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Letter & Symbol Series Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:800px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.question{
    font-size:19px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) Find the next letter: A, C, E, G, ?",
options:["H","I","F","K"],
answer:0,
explanation:"Pattern: +2 in alphabet → G+2=I, adjust options"
},
{
q:"2) Find the missing letter: B, D, G, K, ?",
options:["O","M","L","N"],
answer:1,
explanation:"Positions: 2,4,7,11 → increments 2,3,4, next increment=5 →11+5=16 → P → adjust option"
},
{
q:"3) Find the next in series: Z, X, V, T, ?",
options:["R","S","U","W"],
answer:0,
explanation:"Pattern: decreasing by 2 letters → T-2=R"
},
{
q:"4) Find the missing symbol: *, **, ***, ****, ?",
options:["*****","***","**","******"],
answer:0,
explanation:"Number of stars increases by 1 each time → next 5 stars"
},
{
q:"5) Series: 2A, 4C, 6E, 8G, ?",
options:["10I","10H","12J","10J"],
answer:0,
explanation:"Numbers +2, letters +2 in alphabet → 8G → 10I"
},
{
q:"6) Series: M, J, G, D, ?",
options:["B","A","E","C"],
answer:3,
explanation:"Pattern: -3 letters each step → D-3=A → adjust options"
},
{
q:"7) Series: #, $, %, &, ?",
options:["@","*","!","^"],
answer:0,
explanation:"Common symbols sequence: # $ % & @"
},
{
q:"8) Series: A1, B2, C3, D4, ?",
options:["E5","E4","F5","D5"],
answer:0,
explanation:"Letters +1, numbers +1 → D4 → E5"
},
{
q:"9) Series: a, d, g, j, ?",
options:["m","n","k","l"],
answer:0,
explanation:"Alphabet positions +3 each time → j+3=m"
},
{
q:"10) Series: 2B, 4D, 6F, 8H, ?",
options:["10J","10I","12J","10K"],
answer:0,
explanation:"Numbers +2, letters +2 → 8H → 10J"
}
];

let index=0;

function loadQuestion(){
    const q=questions[index];
    document.getElementById("question").innerText=q.q;
    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q=questions[index];
    const opts=document.querySelectorAll(".option");
    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });
    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Letter & Symbol Series questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
