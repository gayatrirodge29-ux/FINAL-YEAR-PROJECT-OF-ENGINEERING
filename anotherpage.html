        --bg: #b6b8c0;
        --white: #f6f0f4;
        --dark: #0f172a;
      }

      body {

        flex-direction: column; /* stack vertically */
        align-items: center; /* center horizontally */
        justify-content: center; /* center vertically */
        min-height: 100vh;
        margin: 0;
        background: linear-gradient(120deg, var(--accent), var(--accent-light));
        color: white;
        overflow-y: auto;
        margin-bottom: 50px;
      }

      .hero {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      p {
        font-size: 36px;
        font-weight: 600;
      }
      .top-btn {
        margin-top: 10px;
        text-align: center;
        padding: 10px 28px;
        font-size: 18px;
        font-weight: 600;
        border-radius: 10px;
        text-decoration: none;
        background: white;
        color: var(--accent);
        transition: 0.2s ease;
      }
    </style>
  </head>
