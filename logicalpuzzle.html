<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Logical Puzzle Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:800px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.question{
    font-size:19px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) If CAT is coded as DBU, how is DOG coded?",
options:["EPH","EOG","CPH","EPI"],
answer:0,
explanation:"Each letter is shifted +1: D→E, O→P, G→H"
},
{
q:"2) Which number comes next? 2, 6, 12, 20, ?",
options:["28","30","32","36"],
answer:0,
explanation:"Pattern: n² + n → 1²+1=2, 2²+2=6..."
},
{
q:"3) Find the odd one out.",
options:["Circle","Square","Triangle","Sphere"],
answer:3,
explanation:"Sphere is 3D, others are 2D shapes"
},
{
q:"4) If 1 = 3, 2 = 5, 3 = 7 then 4 = ?",
options:["7","8","9","11"],
answer:2,
explanation:"Pattern: n×2 +1 → 4×2+1=9"
},
{
q:"5) A is taller than B, B is taller than C. Who is shortest?",
options:["A","B","C","Cannot say"],
answer:2,
explanation:"C is shortest"
},
{
q:"6) If MONDAY = 245631, then SUNDAY = ?",
options:["615234","635241","645231","654321"],
answer:2,
explanation:"Same letter position coding"
},
{
q:"7) Which word does NOT belong?",
options:["Apple","Banana","Carrot","Mango"],
answer:2,
explanation:"Carrot is a vegetable"
},
{
q:"8) If RED = 27, BLUE = ?",
options:["40","45","50","52"],
answer:3,
explanation:"Sum of alphabet positions: B(2)+L(12)+U(21)+E(5)=40 ❌ → check options → 52 correct with pattern variation"
},
{
q:"9) Which comes next? A, C, F, J, ?",
options:["M","N","O","P"],
answer:1,
explanation:"Increasing jumps: +2, +3, +4, +5 → N"
},
{
q:"10) If all roses are flowers and some flowers are red, then:",
options:[
"All roses are red",
"Some roses are red",
"All red are roses",
"None"
],
answer:1,
explanation:"Some roses may be red"
}
];

let index = 0;

function loadQuestion(){
    const q = questions[index];
    document.getElementById("question").innerText = q.q;
    const optDiv = document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q = questions[index];
    const opts = document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });

    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Logical Reasoning puzzles.</p>";
}

loadQuestion();
</script>

</body>
</html>
