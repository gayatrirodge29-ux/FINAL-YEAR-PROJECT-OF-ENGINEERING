<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Verbal Classification Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:800px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.question{
    font-size:19px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) Find the odd one out: Apple, Banana, Mango, Carrot",
options:["Apple","Banana","Mango","Carrot"],
answer:3,
explanation:"All are fruits except Carrot, which is a vegetable."
},
{
q:"2) Find the odd one: Lion, Tiger, Leopard, Crocodile",
options:["Lion","Tiger","Leopard","Crocodile"],
answer:3,
explanation:"Crocodile is a reptile; others are mammals."
},
{
q:"3) Odd one out: Mercury, Venus, Earth, Moon",
options:["Mercury","Venus","Earth","Moon"],
answer:3,
explanation:"Moon is a satellite; others are planets."
},
{
q:"4) Find the odd one: Red, Blue, Green, Circle",
options:["Red","Blue","Green","Circle"],
answer:3,
explanation:"Circle is a shape; others are colors."
},
{
q:"5) Odd one out: Pen, Pencil, Eraser, Book",
options:["Pen","Pencil","Eraser","Book"],
answer:3,
explanation:"Book is not a writing instrument."
},
{
q:"6) Find the odd one: Dog, Cat, Lion, Crow",
options:["Dog","Cat","Lion","Crow"],
answer:3,
explanation:"Crow is a bird; others are mammals."
},
{
q:"7) Odd one: Wheat, Rice, Maize, Tomato",
options:["Wheat","Rice","Maize","Tomato"],
answer:3,
explanation:"Tomato is a vegetable/fruit; others are cereals."
},
{
q:"8) Find the odd one: Rose, Jasmine, Lily, Mango",
options:["Rose","Jasmine","Lily","Mango"],
answer:3,
explanation:"Mango is a fruit; others are flowers."
},
{
q:"9) Odd one out: Circle, Triangle, Square, Blue",
options:["Circle","Triangle","Square","Blue"],
answer:3,
explanation:"Blue is a color; others are shapes."
},
{
q:"10) Find the odd one: Chair, Table, Sofa, Plate",
options:["Chair","Table","Sofa","Plate"],
answer:3,
explanation:"Plate is not furniture; others are."
}
];

let index=0;

function loadQuestion(){
    const q=questions[index];
    document.getElementById("question").innerText=q.q;
    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q=questions[index];
    const opts=document.querySelectorAll(".option");
    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });
    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Verbal Classification questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
