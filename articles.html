<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Articles Quiz</title>

<style>
body{
    margin:0;
    min-height:100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#ffffff;
    max-width:900px;
    width:100%;
    padding:25px;
    border-radius:14px;
    box-shadow:0 15px 30px rgba(0,0,0,0.3);
}
.question{
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
}
.option{
    padding:12px;
    border:2px solid #e5e7eb;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{background:#f9fafb;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:12px;
}
#prevBtn{background:#f59e0b;color:#fff;}
#nextBtn{background:#16a34a;color:#fff;display:none;}
#explainBtn{background:#2563eb;color:#fff;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f1f5f9;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) She bought ___ umbrella.",
options:["a","an","the","no article"],
answer:1,
explanation:"Umbrella starts with a vowel sound → use 'an'."
},
{
q:"2) ___ sun rises in the east.",
options:["A","An","The","No article"],
answer:2,
explanation:"'The' is used with unique objects like the sun."
},
{
q:"3) He is ___ honest man.",
options:["a","an","the","no article"],
answer:1,
explanation:"Honest starts with a silent 'h' → vowel sound → 'an'."
},
{
q:"4) She is ___ best student in the class.",
options:["a","an","the","no article"],
answer:2,
explanation:"Superlative degree always takes 'the'."
},
{
q:"5) I saw ___ elephant in the zoo.",
options:["a","an","the","no article"],
answer:1,
explanation:"Elephant begins with a vowel sound → 'an'."
},
{
q:"6) He plays ___ cricket.",
options:["a","an","the","no article"],
answer:3,
explanation:"No article is used before names of games."
},
{
q:"7) ___ Ganga is a holy river.",
options:["A","An","The","No article"],
answer:2,
explanation:"'The' is used before names of rivers."
},
{
q:"8) She wants to become ___ engineer.",
options:["a","an","the","no article"],
answer:1,
explanation:"Engineer begins with a vowel sound → 'an'."
},
{
q:"9) He lives in ___ United States.",
options:["a","an","the","no article"],
answer:2,
explanation:"'The' is used before names of countries in plural form."
},
{
q:"10) I read ___ book you gave me.",
options:["a","an","the","no article"],
answer:2,
explanation:"Specific book → use 'the'."
}
];

let index = 0;

function loadQuestion(){
    const q = questions[index];
    document.getElementById("question").innerText = q.q;
    const optDiv = document.getElementById("options");
    optDiv.innerHTML = "";

    document.getElementById("explanation").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("explainBtn").style.display = "none";
    document.getElementById("prevBtn").disabled = index === 0;

    q.options.forEach((opt,i)=>{
        const d = document.createElement("div");
        d.className = "option";
        d.innerText = opt;
        d.onclick = ()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q = questions[index];
    const opts = document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick = null;
        if(idx === q.answer) o.classList.add("correct");
    });

    if(i !== q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText = q.explanation;
    document.getElementById("nextBtn").style.display = "inline-block";
    document.getElementById("explainBtn").style.display = "inline-block";
}

function toggleExplanation(){
    const e = document.getElementById("explanation");
    e.style.display = e.style.display === "none" ? "block" : "none";
}

function nextQuestion(){
    index++;
    if(index < questions.length){
        loadQuestion();
    } else {
        document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You have finished Articles.</p>";
    }
}

function prevQuestion(){
    if(index > 0){
        index--;
        loadQuestion();
    }
}

loadQuestion();
</script>

</body>
</html>
