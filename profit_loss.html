<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Profit and Loss Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:800px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.question{
    font-size:19px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) Cost price = ₹100, Selling price = ₹120. Find profit.",
options:["₹10","₹15","₹20","₹25"],
answer:2,
explanation:"Profit = SP − CP = 120 − 100 = ₹20"
},
{
q:"2) CP = ₹500, SP = ₹450. Find loss.",
options:["₹30","₹40","₹50","₹60"],
answer:2,
explanation:"Loss = CP − SP = 500 − 450 = ₹50"
},
{
q:"3) Profit = ₹40 on CP ₹200. Find profit %.",
options:["10%","15%","20%","25%"],
answer:2,
explanation:"Profit % = (40/200)×100 = 20%"
},
{
q:"4) Loss = ₹25 on CP ₹250. Find loss %.",
options:["5%","10%","15%","20%"],
answer:0,
explanation:"Loss % = (25/250)×100 = 5%"
},
{
q:"5) SP = ₹600, Profit = ₹100. Find CP.",
options:["₹400","₹450","₹500","₹550"],
answer:2,
explanation:"CP = SP − Profit = 600 − 100 = ₹500"
},
{
q:"6) CP = ₹800, Loss = ₹200. Find SP.",
options:["₹500","₹550","₹600","₹650"],
answer:2,
explanation:"SP = CP − Loss = 800 − 200 = ₹600"
},
{
q:"7) If a man gains 10%, SP = ₹110. Find CP.",
options:["₹90","₹95","₹100","₹105"],
answer:2,
explanation:"CP = 110 × 100/110 = ₹100"
},
{
q:"8) If a man loses 20%, CP = ₹500. Find SP.",
options:["₹350","₹400","₹450","₹480"],
answer:1,
explanation:"SP = 500 × 80/100 = ₹400"
},
{
q:"9) Profit % = 25%, CP = ₹400. Find SP.",
options:["₹450","₹480","₹500","₹520"],
answer:2,
explanation:"SP = 400 × 125/100 = ₹500"
},
{
q:"10) Loss % = 10%, CP = ₹900. Find SP.",
options:["₹800","₹810","₹820","₹850"],
answer:1,
explanation:"SP = 900 × 90/100 = ₹810"
}
];

let index = 0;

function loadQuestion(){
    const q = questions[index];
    document.getElementById("question").innerText = q.q;
    const optDiv = document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q = questions[index];
    const opts = document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });

    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Profit & Loss questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
