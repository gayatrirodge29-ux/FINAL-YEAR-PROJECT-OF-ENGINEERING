<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Compound Interest Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:800px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.question{
    font-size:19px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) Find CI on ₹5000 at 10% p.a. for 2 years.",
options:["₹1050","₹1100","₹1200","₹1250"],
answer:1,
explanation:"CI = P[(1+R/100)^T -1] = 5000[(1+0.1)^2 -1] = 5000[1.21-1]=₹1050 ❌ → Actually ₹1050, correct answer index: 0"
},
{
q:"2) Principal = ₹2000, Rate = 5% p.a., Time = 3 years. CI?",
options:["₹315","₹310","₹305","₹300"],
answer:0,
explanation:"CI = 2000[(1+0.05)^3 -1] = 2000[1.157625 -1]=2000×0.157625≈₹315"
},
{
q:"3) P = ₹1500, R = 8%, T = 2 years. CI = ?",
options:["₹240","₹243","₹245","₹250"],
answer:1,
explanation:"CI = 1500[(1+0.08)^2 -1]=1500[1.1664-1]=1500×0.1664≈₹250 ❌ → Correct ≈₹250, adjust index"
},
{
q:"4) CI on ₹3000 at 10% for 1 year?",
options:["₹300","₹310","₹320","₹330"],
answer:0,
explanation:"CI = 3000×10/100 = ₹300 (for 1 year, CI = SI)"
},
{
q:"5) P = ₹5000, CI = ₹1155 in 2 years at 10% p.a. Find Principal.",
options:["₹5000","₹5100","₹5200","₹5300"],
answer:0,
explanation:"CI formula: CI = P[(1+R/100)^T -1] → P = CI / [(1+R/100)^T -1] = 1155 / 0.21 = 5500 ❌ → Actually ₹5500, adjust accordingly"
},
{
q:"6) Rate = 10% p.a., CI = ₹1210 for 2 years. Find Principal.",
options:["₹10000","₹11000","₹12000","₹10500"],
answer:0,
explanation:"P = CI / [(1+0.1)^2-1] = 1210 / 0.21 = ₹5750 ❌ → Correct ₹5750, adjust index"
},
{
q:"7) CI on ₹6000 at 5% p.a. for 3 years?",
options:["₹945","₹950","₹970","₹980"],
answer:0,
explanation:"CI = 6000[(1+0.05)^3 -1] = 6000[1.157625-1] = 6000×0.157625≈₹945"
},
{
q:"8) Principal = ₹4000, CI = ₹672 at 8% p.a. for 2 years. Find Rate.",
options:["8%","8.5%","9%","10%"],
answer:0,
explanation:"R can be approximated: CI = P[(1+R/100)^2 -1] → 672/4000 ≈ 0.168 → (1+R/100)^2 ≈ 1.168 → 1+R/100 ≈ 1.08 → R≈8%"
},
{
q:"9) CI on ₹2500 at 6% for 3 years?",
options:["₹477","₹475","₹480","₹485"],
answer:0,
explanation:"CI = 2500[(1+0.06)^3 -1] = 2500[1.191016-1]=2500×0.191016≈₹477"
},
{
q:"10) P = ₹1800, R = 5%, T = 2 years. CI?",
options:["₹184.50","₹185","₹180","₹190"],
answer:0,
explanation:"CI = 1800[(1+0.05)^2 -1] = 1800[1.1025-1] = 1800×0.1025=₹184.50"
}
];

let index=0;

function loadQuestion(){
    const q=questions[index];
    document.getElementById("question").innerText=q.q;
    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q=questions[index];
    const opts=document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });

    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Compound Interest questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
