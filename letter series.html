<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Letter Series Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#ffffff;
    max-width:820px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    animation:fadeIn 0.6s ease;
}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}
.question{
    font-size:18px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
    transition:0.3s;
}
.option:hover{
    background:#f1f5f9;
}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) A, C, E, G, ?",
options:["H","I","J","K"],
answer:1,
explanation:"Letters skip one each time → A(+2)C(+2)E(+2)G → I"
},
{
q:"2) Z, X, V, T, ?",
options:["R","Q","S","P"],
answer:0,
explanation:"Each letter moves backward by 2 → Z,X,V,T → R"
},
{
q:"3) B, E, H, K, ?",
options:["L","M","N","O"],
answer:2,
explanation:"+3 letters each time → B(+3)E(+3)H(+3)K → N"
},
{
q:"4) A, D, I, P, ?",
options:["X","Y","Z","W"],
answer:0,
explanation:"Positions: 1,4,9,16 → squares → next 25 → Y"
},
{
q:"5) C, F, J, O, ?",
options:["U","T","V","S"],
answer:0,
explanation:"+3,+4,+5,+6 → O(+6)=U"
},
{
q:"6) AZ, BY, CX, DW, ?",
options:["EV","FU","ET","FX"],
answer:0,
explanation:"First letter +1, second letter −1 → E,V"
},
{
q:"7) ACE, BDF, CEG, ?",
options:["DFH","DEF","DEG","CFG"],
answer:0,
explanation:"Each position increases by 1 → D F H"
},
{
q:"8) A, Z, B, Y, C, ?",
options:["X","D","W","V"],
answer:0,
explanation:"Alternating from start and end → A,Z,B,Y,C,X"
},
{
q:"9) M, N, P, Q, S, ?",
options:["T","U","R","V"],
answer:1,
explanation:"+1,+2,+1,+2,+1 → S(+2)=U"
},
{
q:"10) AB, CD, EF, GH, ?",
options:["IJ","JK","HI","KL"],
answer:0,
explanation:"Alphabet pairs → IJ"
}
];

let index=0;

function loadQuestion(){
    const q=questions[index];
    document.getElementById("question").innerText=q.q;
    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q=questions[index];
    const opts=document.querySelectorAll(".option");
    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });
    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display = e.style.display==="none" ? "block" : "none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You have finished Letter Series questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
