<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Queues Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:900px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.question{
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
    white-space:pre-line;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:`1) Which principle does a Queue follow?`,
options:["LIFO","FIFO","Random","Priority"],
answer:1,
explanation:"Queue follows First In First Out (FIFO) principle."
},
{
q:`2) Which operation adds an element at the rear of the queue?`,
options:["Enqueue","Dequeue","Push","Pop"],
answer:0,
explanation:"Enqueue adds an element at the rear of the queue."
},
{
q:`3) Which operation removes an element from the front of the queue?`,
options:["Enqueue","Dequeue","Push","Pop"],
answer:1,
explanation:"Dequeue removes the front element of the queue."
},
{
q:`4) Which of these is a circular queue?`,
options:["Queue with circular array","Queue with LIFO","Queue with stack","Queue using tree"],
answer:0,
explanation:"Circular queue uses a circular array to efficiently use space."
},
{
q:`5) Which queue allows insertion and deletion at both ends?`,
options:["Simple Queue","Deque","Priority Queue","Circular Queue"],
answer:1,
explanation:"Deque (Double-Ended Queue) allows insertion and deletion at both ends."
},
{
q:`6) Which queue is used in BFS (Breadth First Search)?`,
options:["Stack","Queue","Heap","Priority Queue"],
answer:1,
explanation:"BFS uses Queue to traverse level by level."
},
{
q:`7) Which real-world example resembles a queue?`,
options:["Browser history","Printer task queue","Undo feature","Stack of books"],
answer:1,
explanation:"Printer jobs are executed in order of arrival, FIFO — like a queue."
},
{
q:`8) Time complexity of enqueue/dequeue in a simple queue using array?`,
options:["O(1)","O(n)","O(log n)","O(n^2)"],
answer:1,
explanation:"In simple array implementation, dequeue requires shifting elements: O(n)."
},
{
q:`9) What is a priority queue?`,
options:["Queue with priority element access","Queue with LIFO","Circular queue","Queue with stack"],
answer:0,
explanation:"Priority Queue allows elements with higher priority to be served first."
},
{
q:`10) Which of these is NOT a queue type?`,
options:["Simple Queue","Circular Queue","Deque","Stack Queue"],
answer:3,
explanation:"Stack Queue is not a standard type of queue."
}
];

let index = 0;

function loadQuestion(){
    const q = questions[index];
    document.getElementById("question").innerText = q.q;
    const optDiv = document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q = questions[index];
    const opts = document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });

    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Queues questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
