<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Missing Letters Puzzle</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:700px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.question{
    font-size:20px;
    font-weight:bold;
    margin-bottom:15px;
}
input{
    width:120px;
    padding:10px;
    font-size:18px;
    border-radius:6px;
    border:2px solid #ddd;
    text-align:center;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-left:10px;
    background:#2563eb;
    color:white;
}
.correct{
    color:#16a34a;
    font-weight:bold;
    margin-top:10px;
}
.wrong{
    color:#dc2626;
    font-weight:bold;
    margin-top:10px;
}
.explanation{
    margin-top:12px;
    padding:12px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card">
    <div class="question" id="question"></div>

    <input type="text" id="answer" placeholder="Type letter(s)">
    <button onclick="check()">Submit</button>

    <div id="result"></div>
    <div class="explanation" id="explanation"></div>

    <br><br>
    <button onclick="next()">Next Puzzle</button>
</div>

<script>
const puzzles = [
{
q:"1) A _ C E  (Missing Letters?)",
ans:"BD",
exp:"Letters increase by 1: A B C D E"
},
{
q:"2) M O _ Q S",
ans:"P",
exp:"Alphabet sequence: M N O P Q R S"
},
{
q:"3) Z X _ T R",
ans:"V",
exp:"Letters decrease by 2"
},
{
q:"4) A D G _ M",
ans:"J",
exp:"Jump of +3 letters"
},
{
q:"5) B E H _ N",
ans:"K",
exp:"+3 letter pattern"
},
{
q:"6) P L _ D",
ans:"H",
exp:"-4 letter pattern"
},
{
q:"7) C F _ L",
ans:"I",
exp:"+3 pattern"
},
{
q:"8) A Z _ X",
ans:"Y",
exp:"Alternate backward letters"
},
{
q:"9) D H _ P",
ans:"L",
exp:"+4 letter pattern"
},
{
q:"10) J I _ G",
ans:"H",
exp:"-1 backward sequence"
}
];

let index=0;

function load(){
    document.getElementById("question").innerText=puzzles[index].q;
    document.getElementById("answer").value="";
    document.getElementById("result").innerText="";
    document.getElementById("explanation").style.display="none";
}

function check(){
    const user=document.getElementById("answer").value.toUpperCase();
    const p=puzzles[index];
    if(user===p.ans){
        document.getElementById("result").innerHTML="<div class='correct'>✔ Correct!</div>";
    }else{
        document.getElementById("result").innerHTML="<div class='wrong'>✖ Wrong! Correct answer: "+p.ans+"</div>";
    }
    document.getElementById("explanation").innerText=p.exp;
    document.getElementById("explanation").style.display="block";
}

function next(){
    index++;
    if(index<puzzles.length) load();
    else document.querySelector(".card").innerHTML=
        "<h2>🎉 Completed!</h2><p>You finished Missing Letters puzzles.</p>";
}

load();
</script>

</body>
</html>
