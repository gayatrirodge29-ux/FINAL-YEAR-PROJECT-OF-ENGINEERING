<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theme Detection Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:800px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.question{
    font-size:18px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) Passage: 'The government has announced various schemes to encourage renewable energy sources. Solar panels are being subsidized, and wind energy projects are being promoted.' Theme?",
options:[
"Government's role in energy conservation",
"Advancement in fossil fuels",
"Sports activities",
"Education policies"
],
answer:0,
explanation:"The passage focuses on government initiatives to promote renewable energy."
},
{
q:"2) Passage: 'Reading books daily enhances knowledge and improves language skills. It also helps in understanding diverse perspectives.' Theme?",
options:[
"Importance of physical fitness",
"Benefits of reading",
"Traveling tips",
"Cooking techniques"
],
answer:1,
explanation:"The passage highlights the benefits of reading books."
},
{
q:"3) Passage: 'Recycling is essential to reduce waste. Communities are encouraged to segregate garbage and reuse materials wherever possible.' Theme?",
options:[
"Environmental conservation and recycling",
"Traffic management",
"Digital marketing",
"Sports achievements"
],
answer:0,
explanation:"The main idea is about recycling and conserving the environment."
},
{
q:"4) Passage: 'Meditation and yoga help reduce stress and increase focus. They are beneficial for physical and mental health.' Theme?",
options:[
"Healthy lifestyle and stress management",
"Space exploration",
"Financial planning",
"Movie reviews"
],
answer:0,
explanation:"The central idea is about maintaining health and reducing stress."
},
{
q:"5) Passage: 'Volunteering in local communities strengthens social bonds and helps the underprivileged.' Theme?",
options:[
"Social responsibility and community service",
"Sports activities",
"Shopping trends",
"Music festivals"
],
answer:0,
explanation:"The theme revolves around community service and helping society."
},
{
q:"6) Passage: 'Internet has revolutionized communication. People can connect instantly across the globe.' Theme?",
options:[
"Advancements in communication technology",
"Ancient history",
"Cooking recipes",
"Fashion trends"
],
answer:0,
explanation:"The main idea is about how internet has changed communication."
},
{
q:"7) Passage: 'Proper sleep improves memory and concentration. Adults should sleep 7-8 hours daily.' Theme?",
options:[
"Health benefits of sleep",
"Travel destinations",
"Car maintenance",
"Financial tips"
],
answer:0,
explanation:"The passage emphasizes the importance of sleep for health."
},
{
q:"8) Passage: 'Climate change is causing glaciers to melt and sea levels to rise. Immediate action is required.' Theme?",
options:[
"Impact of climate change",
"Sports competitions",
"Cooking tips",
"Fashion trends"
],
answer:0,
explanation:"The central theme is climate change and its consequences."
},
{
q:"9) Passage: 'Electric vehicles are gaining popularity due to their environmental benefits and cost savings.' Theme?",
options:[
"Electric vehicles and their advantages",
"Travel experiences",
"Historical events",
"Educational reforms"
],
answer:0,
explanation:"The passage discusses benefits of electric vehicles."
},
{
q:"10) Passage: 'Healthy eating habits and regular exercise prevent lifestyle diseases like diabetes and hypertension.' Theme?",
options:[
"Maintaining a healthy lifestyle",
"Science experiments",
"Movie analysis",
"Sports achievements"
],
answer:0,
explanation:"The passage focuses on healthy living and prevention of diseases."
}
];

let index=0;

function loadQuestion(){
    const q=questions[index];
    document.getElementById("question").innerText=q.q;
    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q=questions[index];
    const opts=document.querySelectorAll(".option");
    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });
    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Theme Detection questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
