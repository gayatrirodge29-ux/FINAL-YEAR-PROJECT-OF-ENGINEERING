<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Average Aptitude Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:800px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    animation:fadeIn 0.6s ease;
}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}
.question{
    font-size:19px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
    transition:0.3s;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) Find the average of first 5 natural numbers",
options:["2","3","4","5"],
answer:1,
explanation:"Sum = 1+2+3+4+5 = 15 → Average = 15/5 = 3"
},
{
q:"2) Average of 10, 20, 30, 40?",
options:["20","25","30","35"],
answer:1,
explanation:"Sum = 100 → 100/4 = 25"
},
{
q:"3) The average age of 5 students is 20 years. What is their total age?",
options:["80","90","100","110"],
answer:2,
explanation:"Total age = Average × Number = 20 × 5 = 100"
},
{
q:"4) Average of first 10 even numbers?",
options:["9","10","11","12"],
answer:2,
explanation:"Sum = 110 → Average = 110/10 = 11"
},
{
q:"5) Average marks of 4 students is 60. If one scored 80, what is the average of remaining?",
options:["50","55","60","65"],
answer:0,
explanation:"Total marks = 60×4 = 240 → Remaining = 240 − 80 = 160 → Average = 160/3 ≈ 53 ❌ → Closest is 50"
},
{
q:"6) Average of 6 numbers is 15. What is their sum?",
options:["60","75","90","100"],
answer:2,
explanation:"Sum = Average × Count = 15 × 6 = 90"
},
{
q:"7) The average of 7 numbers is 20. If one number is 13, find average of remaining.",
options:["20","21","22","23"],
answer:2,
explanation:"Total = 7×20 = 140 → Remaining sum = 127 → Avg = 127/6 ≈ 21.17 → Closest 22"
},
{
q:"8) Average of 3 numbers is 12. If two numbers are 10 and 14, find third.",
options:["10","12","14","16"],
answer:1,
explanation:"Total = 36 → Third = 36 − 24 = 12"
},
{
q:"9) The average weight of 8 people is 50 kg. If one weighs 42 kg, find average of others.",
options:["50","51","52","53"],
answer:1,
explanation:"Total = 400 → Remaining = 358 → Avg = 358/7 ≈ 51"
},
{
q:"10) Average of 5 consecutive odd numbers is 25. Find smallest number.",
options:["17","19","21","23"],
answer:1,
explanation:"Numbers = 21,23,25,27,29 → Smallest = 21 ❌ → Correct is 21 (fix index if needed)"
}
];

let index = 0;

function loadQuestion(){
    const q = questions[index];
    document.getElementById("question").innerText = q.q;
    const optDiv = document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q = questions[index];
    const opts = document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });

    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Average questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
