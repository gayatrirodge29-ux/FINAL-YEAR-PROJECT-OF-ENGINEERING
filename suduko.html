<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sudoku Game</title>

<style>
body{
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#7588db,#8859b7);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}

.container{
    background:#fff;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 30px rgba(0,0,0,0.3);
    text-align:center;
}

h1{ margin-bottom:15px; }

table{
    border-collapse:collapse;
    margin:auto;
}

td{
    border:1px solid #999;
}

input{
    width:45px;
    height:45px;
    text-align:center;
    font-size:18px;
    border:none;
}

input:disabled{
    background:#e5e7eb;
    font-weight:bold;
}

.bold-border{
    border-right:3px solid black;
}
.bottom-border{
    border-bottom:3px solid black;
}

button{
    margin-top:15px;
    padding:10px 18px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    background:#4f46e5;
    color:white;
    font-size:14px;
}
button:hover{ background:#4338ca; }

#result{
    margin-top:10px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="container">
<h1>Sudoku</h1>

<table id="sudoku"></table>

<button onclick="checkSudoku()">Check Solution</button>
<div id="result"></div>
</div>

<script>
const puzzle = [
 [5,3,0, 0,7,0, 0,0,0],
 [6,0,0, 1,9,5, 0,0,0],
 [0,9,8, 0,0,0, 0,6,0],

 [8,0,0, 0,6,0, 0,0,3],
 [4,0,0, 8,0,3, 0,0,1],
 [7,0,0, 0,2,0, 0,0,6],

 [0,6,0, 0,0,0, 2,8,0],
 [0,0,0, 4,1,9, 0,0,5],
 [0,0,0, 0,8,0, 0,7,9]
];

const solution = [
 [5,3,4,6,7,8,9,1,2],
 [6,7,2,1,9,5,3,4,8],
 [1,9,8,3,4,2,5,6,7],
 [8,5,9,7,6,1,4,2,3],
 [4,2,6,8,5,3,7,9,1],
 [7,1,3,9,2,4,8,5,6],
 [9,6,1,5,3,7,2,8,4],
 [2,8,7,4,1,9,6,3,5],
 [3,4,5,2,8,6,1,7,9]
];

const table = document.getElementById("sudoku");

for(let i=0;i<9;i++){
    const row = document.createElement("tr");
    for(let j=0;j<9;j++){
        const cell = document.createElement("td");
        const input = document.createElement("input");
        input.maxLength=1;

        if(puzzle[i][j]!==0){
            input.value=puzzle[i][j];
            input.disabled=true;
        }

        if((j+1)%3===0 && j!==8) cell.classList.add("bold-border");
        if((i+1)%3===0 && i!==8) cell.classList.add("bottom-border");

        cell.appendChild(input);
        row.appendChild(cell);
    }
    table.appendChild(row);
}

function checkSudoku(){
    let correct=true;
    const inputs=document.querySelectorAll("input");
    let idx=0;

    for(let i=0;i<9;i++){
        for(let j=0;j<9;j++){
            if(!inputs[idx].disabled){
                if(parseInt(inputs[idx].value)!==solution[i][j]){
                    correct=false;
                }
            }
            idx++;
        }
    }

    document.getElementById("result").innerText =
        correct ? "✅ Correct Solution!" : "❌ Incorrect Solution!";
}
</script>

</body>
</html>
