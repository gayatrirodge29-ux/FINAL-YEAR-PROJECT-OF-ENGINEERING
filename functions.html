<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Functions Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:900px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.question{
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
    white-space:pre-line;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:`1) What is the return type of a function that does not return a value in C/C++?`,
options:["int","void","float","char"],
answer:1,
explanation:"A function that does not return anything is declared as void."
},
{
q:`2) Which keyword is used to define a function in Python?`,
options:["def","function","func","void"],
answer:0,
explanation:"In Python, functions are defined using the 'def' keyword."
},
{
q:`3) What is output?\ndef greet():\n    print(\"Hello\")\ngreet()`,
options:["greet","Hello","None","Error"],
answer:1,
explanation:"Calling greet() prints 'Hello' on the screen."
},
{
q:`4) What is a function with no name called?`,
options:["Anonymous function","Lambda","Void function","Recursive function"],
answer:0,
explanation:"Functions without a name are called anonymous functions."
},
{
q:`5) Which of the following allows a function to call itself?`,
options:["Iteration","Recursion","Loop","Lambda"],
answer:1,
explanation:"Recursion is the process where a function calls itself."
},
{
q:`6) What is the default return value of a function in Python if nothing is returned?`,
options:["0","None","-1","Error"],
answer:1,
explanation:"If a function doesn’t explicitly return a value, it returns None."
},
{
q:`7) How do you call a function named sumNumbers with two arguments in JavaScript?`,
options:["sumNumbers(a,b)","call sumNumbers(a,b)","sumNumbers = (a,b)","None"],
answer:0,
explanation:"Functions are called using their name followed by parentheses with arguments."
},
{
q:`8) Which is NOT a valid function definition in C?`,
options:["int add(int a,int b)","void greet()","float multiply(a,b)","void main()"],
answer:2,
explanation:"In C, all parameters must have types; 'float multiply(a,b)' is invalid."
},
{
q:`9) What is recursion limit in Python controlled by?`,
options:["sys.limit","sys.maxsize","sys.setrecursionlimit","None"],
answer:2,
explanation:"You can control recursion limit using sys.setrecursionlimit()"
},
{
q:`10) Output?\ndef square(n):\n    return n*n\nprint(square(5))`,
options:["5","25","10","None"],
answer:1,
explanation:"square(5) returns 25"
}
];

let index = 0;

function loadQuestion(){
    const q = questions[index];
    document.getElementById("question").innerText = q.q;
    const optDiv = document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q = questions[index];
    const opts = document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });

    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Functions questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
