<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ordering of Words Quiz</title>

<style>
body{
    margin:0;
    min-height:100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:900px;
    width:100%;
    padding:25px;
    border-radius:14px;
    box-shadow:0 15px 30px rgba(0,0,0,0.25);
}
.question{
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
}
.option{
    padding:12px;
    border:2px solid #e5e7eb;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{
    background:#f9fafb;
}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:12px;
}
#prevBtn{background:#f59e0b;color:#fff;}
#nextBtn{background:#16a34a;color:#fff;display:none;}
#explainBtn{background:#2563eb;color:#fff;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f1f5f9;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) Arrange the words in alphabetical order:",
options:[
"Apple, Ant, Ball, Bat",
"Ant, Apple, Ball, Bat",
"Ball, Bat, Ant, Apple",
"Ant, Ball, Apple, Bat"
],
answer:1,
explanation:"Alphabetical order: Ant → Apple → Ball → Bat"
},
{
q:"2) Arrange the words in dictionary order:",
options:[
"Cat, Cow, Camel, Crow",
"Camel, Cat, Cow, Crow",
"Camel, Cat, Crow, Cow",
"Cat, Camel, Cow, Crow"
],
answer:2,
explanation:"Camel → Cat → Crow → Cow"
},
{
q:"3) Arrange the words alphabetically:",
options:[
"Pen, Pencil, Paper, Paint",
"Paint, Paper, Pen, Pencil",
"Paper, Paint, Pen, Pencil",
"Paint, Paper, Pencil, Pen"
],
answer:1,
explanation:"Paint → Paper → Pen → Pencil"
},
{
q:"4) Arrange the words in correct alphabetical order:",
options:[
"Dog, Deer, Donkey, Dolphin",
"Deer, Dog, Dolphin, Donkey",
"Deer, Dog, Donkey, Dolphin",
"Dog, Deer, Dolphin, Donkey"
],
answer:1,
explanation:"Deer → Dog → Dolphin → Donkey"
},
{
q:"5) Arrange the words alphabetically:",
options:[
"Rose, Lily, Lotus, Jasmine",
"Jasmine, Lily, Lotus, Rose",
"Lily, Jasmine, Lotus, Rose",
"Jasmine, Lotus, Lily, Rose"
],
answer:1,
explanation:"Jasmine → Lily → Lotus → Rose"
},
{
q:"6) Arrange the words in dictionary order:",
options:[
"Book, Bottle, Box, Bag",
"Bag, Book, Bottle, Box",
"Bag, Bottle, Book, Box",
"Book, Bag, Bottle, Box"
],
answer:1,
explanation:"Bag → Book → Bottle → Box"
},
{
q:"7) Arrange alphabetically:",
options:[
"Sun, Star, Sky, Sea",
"Sea, Sky, Star, Sun",
"Sky, Sea, Star, Sun",
"Star, Sun, Sea, Sky"
],
answer:1,
explanation:"Sea → Sky → Star → Sun"
},
{
q:"8) Arrange the words correctly:",
options:[
"Teacher, Student, School, Class",
"Class, School, Student, Teacher",
"School, Class, Teacher, Student",
"Student, Teacher, School, Class"
],
answer:1,
explanation:"Class → School → Student → Teacher"
},
{
q:"9) Arrange alphabetically:",
options:[
"Mobile, Mouse, Monitor, Modem",
"Modem, Mobile, Monitor, Mouse",
"Mobile, Modem, Monitor, Mouse",
"Modem, Mobile, Mouse, Monitor"
],
answer:1,
explanation:"Modem → Mobile → Monitor → Mouse"
},
{
q:"10) Arrange the words in alphabetical order:",
options:[
"January, June, July, April",
"April, January, July, June",
"April, January, June, July",
"January, April, June, July"
],
answer:2,
explanation:"April → January → June → July"
}
];

let index=0;

function loadQuestion(){
    const q=questions[index];
    document.getElementById("question").innerText=q.q;
    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q=questions[index];
    const opts=document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });

    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length){
        loadQuestion();
    }else{
        document.getElementById("card").innerHTML=
        "<h2>🎉 Quiz Completed!</h2><p>Ordering of Words test finished.</p>";
    }
}

function prevQuestion(){
    if(index>0){index--;loadQuestion();}
}

loadQuestion();
</script>

</body>
</html>
