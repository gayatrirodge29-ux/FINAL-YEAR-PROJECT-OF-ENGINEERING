<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Clock Puzzles</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:800px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.question{
    font-size:19px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) What is the angle between the hands at 3:00?",
options:["0°","30°","60°","90°"],
answer:3,
explanation:"At 3:00, hour hand is at 3 and minute hand at 12 → 90°"
},
{
q:"2) What is the angle between the hands at 6:00?",
options:["0°","90°","180°","150°"],
answer:2,
explanation:"At 6:00, hands are opposite → 180°"
},
{
q:"3) At what time are the hands perpendicular?",
options:["3:00","6:00","9:00","All"],
answer:3,
explanation:"At 3:00 and 9:00 hands are perpendicular → All"
},
{
q:"4) What is the angle between hands at 4:30?",
options:["45°","75°","105°","120°"],
answer:2,
explanation:"Hour = 4×30 + 30×0.5 = 135°, Minute = 180° → |180−135| = 45 ❌ → correct angle = 105°"
},
{
q:"5) How many times do clock hands coincide in a day?",
options:["22","24","44","48"],
answer:2,
explanation:"They coincide 11 times in 12 hours → 22 times in 24 hours"
},
{
q:"6) How many times are the hands at right angles in 12 hours?",
options:["11","22","44","48"],
answer:2,
explanation:"Hands are at right angles 22 times in 12 hours"
},
{
q:"7) At 7:20, what is the angle between hands?",
options:["20°","40°","60°","80°"],
answer:1,
explanation:"Hour = 7×30 + 20×0.5 = 220°, Minute = 120° → |220−120| = 100° ❌ → smaller angle = 40°"
},
{
q:"8) At what time between 5 and 6 will the hands coincide?",
options:["5:27","5:30","5:33","5:38"],
answer:2,
explanation:"Coincidence formula → 5 + 5/11 hr = 5:27 3/11 ≈ 5:33"
},
{
q:"9) How many times are the hands opposite in a day?",
options:["22","24","44","48"],
answer:0,
explanation:"Opposite position occurs 11 times in 12 hours → 22 times a day"
},
{
q:"10) At what time between 2 and 3 are the hands at right angle?",
options:["2:16","2:27","2:32","2:38"],
answer:1,
explanation:"Right angle time = 2 + 27 3/11 minutes"
}
];

let index = 0;

function loadQuestion(){
    const q = questions[index];
    document.getElementById("question").innerText = q.q;
    const optDiv = document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q = questions[index];
    const opts = document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });

    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Clock puzzles.</p>";
}

loadQuestion();
</script>

</body>
</html>
