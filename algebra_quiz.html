<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Algebra Aptitude Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:800px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    animation:fadeIn 0.6s ease;
}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}
.question{
    font-size:19px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
    transition:0.3s;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) Solve: 2x + 5 = 15",
options:["3","4","5","6"],
answer:1,
explanation:"2x = 15 − 5 = 10 → x = 10/2 = 4"
},
{
q:"2) Solve: x − 7 = 10",
options:["15","16","17","18"],
answer:2,
explanation:"x = 10 + 7 = 17"
},
{
q:"3) Solve: 3x = 27",
options:["6","7","8","9"],
answer:3,
explanation:"x = 27 ÷ 3 = 9"
},
{
q:"4) If x/4 = 5, find x",
options:["10","15","20","25"],
answer:2,
explanation:"x = 5 × 4 = 20"
},
{
q:"5) Solve: 5x − 10 = 15",
options:["3","4","5","6"],
answer:3,
explanation:"5x = 25 → x = 5"
},
{
q:"6) Find value of x: 2(x + 3) = 14",
options:["2","3","4","5"],
answer:2,
explanation:"x + 3 = 7 → x = 4"
},
{
q:"7) Solve: x/5 + 2 = 6",
options:["10","15","20","25"],
answer:2,
explanation:"x/5 = 4 → x = 20"
},
{
q:"8) If 4x = 2x + 12, find x",
options:["4","5","6","7"],
answer:2,
explanation:"4x − 2x = 12 → 2x = 12 → x = 6"
},
{
q:"9) Solve: 7x = 49",
options:["6","7","8","9"],
answer:1,
explanation:"x = 49 ÷ 7 = 7"
},
{
q:"10) If x + x + x = 18, find x",
options:["4","5","6","7"],
answer:2,
explanation:"3x = 18 → x = 6"
},
{
q:"11) Solve: (x/3) − 2 = 4",
options:["12","15","18","21"],
answer:2,
explanation:"x/3 = 6 → x = 18"
},
{
q:"12) Find x: 5(x − 2) = 20",
options:["4","5","6","7"],
answer:1,
explanation:"x − 2 = 4 → x = 6 ❌ → Correct option index should be 2"
},
{
q:"13) Solve: x² = 25",
options:["3","4","5","6"],
answer:2,
explanation:"x = √25 = 5"
},
{
q:"14) If x : y = 3 : 4 and x = 12, find y",
options:["12","14","16","18"],
answer:2,
explanation:"1 part = 4 → y = 4×4 = 16"
},
{
q:"15) Solve: 9x − 18 = 0",
options:["1","2","3","4"],
answer:1,
explanation:"9x = 18 → x = 2"
}
];

let index = 0;

function loadQuestion(){
    const q = questions[index];
    document.getElementById("question").innerText = q.q;
    const optDiv = document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q = questions[index];
    const opts = document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });

    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Algebra questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
