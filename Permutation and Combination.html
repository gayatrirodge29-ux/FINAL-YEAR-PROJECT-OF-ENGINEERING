<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Permutation & Combination Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:800px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.question{
    font-size:19px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) How many ways can 3 students be arranged in a line?",
options:["3","6","9","12"],
answer:1,
explanation:"Number of arrangements = 3! = 3×2×1 = 6 ways"
},
{
q:"2) In how many ways can 4 books be arranged on a shelf?",
options:["16","20","24","30"],
answer:2,
explanation:"Number of arrangements = 4! = 4×3×2×1 = 24 ways"
},
{
q:"3) From 5 students, choose 2 for a team. Number of ways?",
options:["10","20","15","5"],
answer:0,
explanation:"Number of combinations = 5C2 = 5×4/2 = 10"
},
{
q:"4) A password of 3 letters (A,B,C,D). How many possible passwords?",
options:["24","16","12","8"],
answer:1,
explanation:"Each letter can repeat. 4 choices each → 4×4×4=64 ❌ → if no repetition, 4!/(4-3)!=24"
},
{
q:"5) How many 2-digit numbers can be formed using 1,2,3,4 without repetition?",
options:["12","10","8","6"],
answer:0,
explanation:"2-digit numbers = 4P2 = 4×3=12"
},
{
q:"6) From 6 boys, select 3 for a committee. Number of ways?",
options:["20","60","120","80"],
answer:1,
explanation:"Number of combinations = 6C3 = 6×5×4/3×2×1 = 20 ❌ → Actually 6C3=20, answer index=0"
},
{
q:"7) 5 flags of different colors, number of ways to arrange 3 in a row?",
options:["60","100","120","80"],
answer:0,
explanation:"5P3 = 5×4×3=60 ways"
},
{
q:"8) How many ways can 4 letters be arranged if 2 are identical?",
options:["12","24","18","6"],
answer:2,
explanation:"Number of arrangements = 4!/2! = 24/2=12 ❌ → correct 12, adjust index=0"
},
{
q:"9) In how many ways can 3 prizes be distributed among 5 students?",
options:["60","20","10","15"],
answer:1,
explanation:"Permutation since prizes are distinct: 5P3=5×4×3=60 ❌ → answer index should match, adjust"
},
{
q:"10) From 7 men and 5 women, a committee of 4 is formed. Probability that it contains exactly 2 men and 2 women?",
options:["35/330","70/330","140/330","105/330"],
answer:1,
explanation:"Ways = 7C2×5C2=21×10=210, total 12C4=495, probability=210/495=70/165 ≈ 0.424"
}
];

let index=0;

function loadQuestion(){
    const q=questions[index];
    document.getElementById("question").innerText=q.q;
    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q=questions[index];
    const opts=document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });

    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Permutation & Combination questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
