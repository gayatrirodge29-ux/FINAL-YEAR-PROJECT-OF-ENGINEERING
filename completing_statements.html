<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Completing Statements Quiz</title>

<style>
body{
    margin:0;
    min-height:100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#ffffff;
    max-width:900px;
    width:100%;
    padding:25px;
    border-radius:14px;
    box-shadow:0 15px 30px rgba(0,0,0,0.3);
}
.question{
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
}
.option{
    padding:12px;
    border:2px solid #e5e7eb;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{
    background:#f9fafb;
}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:12px;
}
#prevBtn{background:#f59e0b;color:#fff;}
#nextBtn{background:#16a34a;color:#fff;display:none;}
#explainBtn{background:#2563eb;color:#fff;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f1f5f9;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) He was so tired that he could hardly ______.",
options:["walk","walking","walked","walks"],
answer:0,
explanation:"After 'could', base form of verb is used → walk"
},
{
q:"2) She is not only intelligent ______ hardworking.",
options:["and","but also","also","or"],
answer:1,
explanation:"Correct correlative conjunction → not only...but also"
},
{
q:"3) The teacher asked the students ______ the noise.",
options:["stop","to stop","stopping","stopped"],
answer:1,
explanation:"Ask + object + to + verb → to stop"
},
{
q:"4) He was punished ______ his mistake.",
options:["for","with","by","from"],
answer:0,
explanation:"'Punished for' is the correct preposition"
},
{
q:"5) She is afraid ______ dogs.",
options:["from","with","of","by"],
answer:2,
explanation:"Afraid of is the correct phrase"
},
{
q:"6) He has been working here ______ 2019.",
options:["since","for","from","by"],
answer:0,
explanation:"'Since' is used with a point of time"
},
{
q:"7) The train arrived ______ time.",
options:["at","on","in","by"],
answer:1,
explanation:"Correct phrase → on time"
},
{
q:"8) I prefer tea ______ coffee.",
options:["than","over","to","with"],
answer:2,
explanation:"Prefer is followed by 'to'"
},
{
q:"9) She is fond ______ music.",
options:["with","of","for","in"],
answer:1,
explanation:"Fond of is the correct usage"
},
{
q:"10) He is good ______ mathematics.",
options:["at","in","with","for"],
answer:0,
explanation:"Good at is the correct preposition"
}
];

let index = 0;

function loadQuestion(){
    const q = questions[index];
    document.getElementById("question").innerText = q.q;
    const optDiv = document.getElementById("options");
    optDiv.innerHTML = "";
    document.getElementById("explanation").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("explainBtn").style.display = "none";
    document.getElementById("prevBtn").disabled = index === 0;

    q.options.forEach((opt,i)=>{
        const d = document.createElement("div");
        d.className = "option";
        d.innerText = opt;
        d.onclick = ()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q = questions[index];
    const opts = document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick = null;
        if(idx === q.answer) o.classList.add("correct");
    });

    if(i !== q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText = q.explanation;
    document.getElementById("nextBtn").style.display = "inline-block";
    document.getElementById("explainBtn").style.display = "inline-block";
}

function toggleExplanation(){
    const e = document.getElementById("explanation");
    e.style.display = e.style.display === "none" ? "block" : "none";
}

function nextQuestion(){
    index++;
    if(index < questions.length){
        loadQuestion();
    } else {
        document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You have finished Completing Statements.</p>";
    }
}

function prevQuestion(){
    if(index > 0){
        index--;
        loadQuestion();
    }
}

loadQuestion();
</script>

</body>
</html>
