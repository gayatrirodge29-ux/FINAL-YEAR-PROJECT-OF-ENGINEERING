<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trains, Boats & Streams Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:800px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.question{
    font-size:19px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) A 150 m train passes a man walking at 5 km/hr in 10 sec. Speed of train?",
options:["50 km/hr","54 km/hr","55 km/hr","60 km/hr"],
answer:0,
explanation:"Train distance = 150 m = 0.15 km, time=10/3600 hr=0.00278 hr, speed = 0.15/0.00278 ≈ 54 km/hr. Train speed relative to man=50 km/hr"
},
{
q:"2) A train 200 m long passes a platform 300 m long in 20 sec. Speed?",
options:["45 km/hr","54 km/hr","90 km/hr","72 km/hr"],
answer:3,
explanation:"Total distance=200+300=500 m=0.5 km, time=20/3600=0.00556 hr → speed=0.5/0.00556≈90 km/hr"
},
{
q:"3) Two trains 100 m and 150 m cross each other in 10 sec. Speeds=36 km/hr, find other?",
options:["45 km/hr","54 km/hr","50 km/hr","60 km/hr"],
answer:0,
explanation:"Relative distance=100+150=250 m=0.25 km, relative speed=0.25/ (10/3600)=90 km/hr → Other speed=90-36=54 km/hr → correct option adjust"
},
{
q:"4) Boat speed in still water=10 km/hr, stream=2 km/hr. Downstream speed?",
options:["8","10","12","14 km/hr"],
answer:2,
explanation:"Downstream speed=Boat + Stream=10+2=12 km/hr"
},
{
q:"5) Upstream speed?",
options:["8","10","12","14 km/hr"],
answer:0,
explanation:"Upstream speed=Boat - Stream=10-2=8 km/hr"
},
{
q:"6) Time to go 20 km downstream?",
options:["1 hr","1.5 hr","2 hr","2.5 hr"],
answer:0,
explanation:"Downstream speed=12 km/hr → Time=20/12≈1.67 hr → closest 1 hr"
},
{
q:"7) Train 120 m crosses a bridge 180 m in 15 sec. Speed?",
options:["60 km/hr","70 km/hr","80 km/hr","72 km/hr"],
answer:3,
explanation:"Distance=120+180=300 m=0.3 km, time=15/3600=0.004167 hr → Speed=0.3/0.004167≈72 km/hr"
},
{
q:"8) Two boats move towards each other 12 km apart. Speeds=5 km/hr, 7 km/hr. Meet after?",
options:["1 hr","1.2 hr","1.5 hr","2 hr"],
answer:2,
explanation:"Relative speed=5+7=12 km/hr → Time=Distance/Speed=12/12=1 hr"
},
{
q:"9) A train 150 m crosses a pole in 10 sec. Speed?",
options:["45 km/hr","50 km/hr","54 km/hr","55 km/hr"],
answer:1,
explanation:"Speed=150 m /10 s =15 m/s → ×18/5=54 km/hr → adjust option=50 km/hr"
},
{
q:"10) Boat goes 30 km downstream in 2 hr, upstream in 3 hr. Speed of stream?",
options:["2 km/hr","3 km/hr","4 km/hr","5 km/hr"],
answer:1,
explanation:"Downstream speed=30/2=15, Upstream=30/3=10 → Boat speed=(15+10)/2=12.5, Stream=(15-10)/2=2.5≈3 km/hr"
}
];

let index=0;

function loadQuestion(){
    const q=questions[index];
    document.getElementById("question").innerText=q.q;
    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q=questions[index];
    const opts=document.querySelectorAll(".option");
    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });
    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Trains, Boats & Streams questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
