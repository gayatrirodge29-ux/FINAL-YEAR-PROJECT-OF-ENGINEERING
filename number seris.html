<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Number Series Aptitude</title>

<style>
/* ---------- Background ---------- */
body {
    font-family: Arial, sans-serif;
    min-height: 100vh;
    margin: 0;
    padding: 40px;
    background: linear-gradient(135deg, #7588db, #8859b7);
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ---------- Card ---------- */
.card {
    width: 100%;
    max-width: 650px;
    background: #ffffff;
    padding: 25px;
    border-radius: 12px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    animation: fadeIn 0.6s ease;
}

/* ---------- Animation ---------- */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ---------- Question ---------- */
.question {
    font-size: 19px;
    font-weight: bold;
    margin-bottom: 20px;
}

/* ---------- Options ---------- */
.option {
    padding: 12px;
    border: 2px solid #654b4b;
    border-radius: 8px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: 0.3s;
}

.option:hover {
    background: #f1f5f9;
    transform: scale(1.01);
}

.correct {
    border-color: #22c55e;
    background: #dcfce7;
    font-weight: bold;
}

.wrong {
    border-color: #ef4444;
    background: #fee2e2;
    font-weight: bold;
}

/* ---------- Buttons ---------- */
button {
    margin-top: 15px;
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
}

#explainBtn {
    background: #2563eb;
    color: white;
    display: none;
}

#nextBtn {
    background: #16a34a;
    color: white;
    display: none;
    margin-left: 10px;
}

#prevBtn {
    background: #e40b9f;
    color: #f3ecec;
    margin-right: 10px;
}

#prevBtn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* ---------- Explanation ---------- */
.explanation {
    margin-top: 15px;
    padding: 15px;
    background: #f8fafc;
    border-left: 4px solid #33a1dd;
    display: none;
    animation: fadeIn 0.4s ease;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
    { q:"1) 2, 4, 8, 16, ?", options:["18","24","32","30"], answer:2, explanation:"Multiply by 2 → 16 × 2 = 32" },
    { q:"2) 1, 4, 9, 16, ?", options:["20","25","30","36"], answer:1, explanation:"Perfect squares → 5² = 25" },
    { q:"3) 3, 6, 12, 24, ?", options:["36","48","30","60"], answer:1, explanation:"Multiply by 2 → 24 × 2 = 48" },
    { q:"4) 5, 10, 20, 40, ?", options:["60","70","80","90"], answer:2, explanation:"Multiply by 2 → 80" },
    { q:"5) 1, 3, 6, 10, ?", options:["13","14","15","16"], answer:2, explanation:"+2, +3, +4, +5 → 15" },
    { q:"6) 2, 5, 10, 17, ?", options:["24","26","28","30"], answer:1, explanation:"+3, +5, +7, +9 → 26" },
    { q:"7) 1, 1, 2, 3, 5, ?", options:["6","7","8","9"], answer:2, explanation:"Fibonacci → 3 + 5 = 8" },
    { q:"8) 10, 20, 30, 40, ?", options:["45","50","55","60"], answer:1, explanation:"Add 10 → 50" },
    { q:"9) 100, 90, 80, 70, ?", options:["65","60","55","50"], answer:1, explanation:"Subtract 10 → 60" },
    { q:"10) 1, 8, 27, 64, ?", options:["100","125","216","343"], answer:1, explanation:"Cubes → 5³ = 125" },
    { q:"11) 2, 6, 12, 20, ?", options:["28","30","32","36"], answer:1, explanation:"n(n+1) → 5×6 = 30" },
    { q:"12) 81, 27, 9, 3, ?", options:["2","1","0","6"], answer:1, explanation:"Divide by 3 → 1" },
    { q:"13) 4, 9, 16, 25, ?", options:["30","36","40","49"], answer:1, explanation:"Squares → 6² = 36" },
    { q:"14) 7, 14, 28, 56, ?", options:["84","98","112","120"], answer:2, explanation:"×2 → 112" },
    { q:"15) 1, 4, 13, 40, ?", options:["121","120","100","81"], answer:0, explanation:"×3 +1 → 121" },
    { q:"16) 9, 18, 36, 72, ?", options:["108","144","216","90"], answer:1, explanation:"×2 → 144" },
    { q:"17) 1, 2, 6, 24, ?", options:["60","100","120","240"], answer:2, explanation:"Factorial → 5! = 120" },
    { q:"18) 5, 11, 23, 47, ?", options:["94","95","96","97"], answer:1, explanation:"×2 +1 → 95" },
    { q:"19) 30, 27, 24, 21, ?", options:["20","19","18","17"], answer:2, explanation:"Subtract 3 → 18" },
    { q:"20) 2, 3, 5, 7, 11, ?", options:["12","13","14","15"], answer:1, explanation:"Prime numbers → 13" }
];

let index = 0;

function loadQuestion() {
    const q = questions[index];
    document.getElementById("question").innerText = q.q;
    const optionsDiv = document.getElementById("options");
    optionsDiv.innerHTML = "";
    document.getElementById("explanation").style.display = "none";
    document.getElementById("explainBtn").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("prevBtn").disabled = index === 0;

    q.options.forEach((opt, i) => {
        const div = document.createElement("div");
        div.className = "option";
        div.innerText = opt;
        div.onclick = () => checkAnswer(div, i);
        optionsDiv.appendChild(div);
    });
}

function checkAnswer(selected, i) {
    const q = questions[index];
    const options = document.querySelectorAll(".option");

    options.forEach((opt, idx) => {
        opt.onclick = null;
        if (idx === q.answer) opt.classList.add("correct");
    });

    if (i !== q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText = q.explanation;
    document.getElementById("explainBtn").style.display = "inline-block";
    document.getElementById("nextBtn").style.display = "inline-block";
}

function toggleExplanation() {
    const exp = document.getElementById("explanation");
    exp.style.display = exp.style.display === "none" ? "block" : "none";
}

function nextQuestion() {
    index++;
    if (index < questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You have finished all 20 Number Series questions.</p>";
}

function prevQuestion() {
    if (index > 0) {
        index--;
        loadQuestion();
    }
}

loadQuestion();
</script>

</body>
</html>
