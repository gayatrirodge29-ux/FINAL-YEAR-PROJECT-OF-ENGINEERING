<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Spotting Errors Quiz</title>

<style>
body{
    margin:0;
    min-height:100vh;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#ffffff;
    max-width:850px;
    width:100%;
    padding:25px;
    border-radius:14px;
    box-shadow:0 15px 30px rgba(0,0,0,0.3);
    animation:slideIn 0.6s ease;
}
@keyframes slideIn{
    from{opacity:0;transform:translateY(30px);}
    to{opacity:1;transform:translateY(0);}
}
.question{
    font-size:18px;
    font-weight:bold;
    margin-bottom:18px;
}
.option{
    padding:12px;
    border:2px solid #e5e7eb;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
    transition:0.3s;
}
.option:hover{
    background:#f9fafb;
    transform:scale(1.01);
}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:12px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f1f5f9;
    border-left:4px solid #2563eb;
    display:none;
}
.footer{
    margin-top:15px;
    font-size:14px;
    color:#475569;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
    <div class="footer">Choose the part which contains the error.</div>
</div>

<script>
const questions = [
{
q:"1) He is one of the best player / in the team / who have performed / exceptionally well.",
options:[
"A) He is one of the best player",
"B) in the team",
"C) who have performed",
"D) No error"
],
answer:0,
explanation:"'One of the best players' is correct. Singular 'player' is wrong."
},
{
q:"2) She did not knew / where he was / going yesterday / night.",
options:[
"A) She did not knew",
"B) where he was",
"C) going yesterday",
"D) No error"
],
answer:0,
explanation:"After 'did not', base form is used → 'know', not 'knew'."
},
{
q:"3) Each of the students / were given / a new identity card / yesterday.",
options:[
"A) Each of the students",
"B) were given",
"C) a new identity card",
"D) No error"
],
answer:1,
explanation:"'Each' takes a singular verb → 'was given'."
},
{
q:"4) He is senior / than me / in this office / by two years.",
options:[
"A) He is senior",
"B) than me",
"C) in this office",
"D) No error"
],
answer:1,
explanation:"'Senior' is followed by 'to', not 'than'."
},
{
q:"5) The teacher asked / the students that / why they were / making noise.",
options:[
"A) The teacher asked",
"B) the students that",
"C) why they were",
"D) No error"
],
answer:1,
explanation:"'Asked' is followed by 'why', not 'that'."
},
{
q:"6) He gave me / an advice / which was / very useful.",
options:[
"A) He gave me",
"B) an advice",
"C) which was",
"D) No error"
],
answer:1,
explanation:"'Advice' is uncountable → no 'an'."
},
{
q:"7) She prefers coffee / than tea / in the morning / daily.",
options:[
"A) She prefers coffee",
"B) than tea",
"C) in the morning",
"D) No error"
],
answer:1,
explanation:"'Prefer' is followed by 'to', not 'than'."
},
{
q:"8) The police / has arrested / the thieves / last night.",
options:[
"A) The police",
"B) has arrested",
"C) the thieves",
"D) No error"
],
answer:1,
explanation:"'Police' is plural → 'have arrested'."
},
{
q:"9) He runs faster / than any other / boys / in his class.",
options:[
"A) He runs faster",
"B) than any other",
"C) boys",
"D) No error"
],
answer:2,
explanation:"Comparison with singular → 'boy', not 'boys'."
},
{
q:"10) I am not / accustomed with / such rude / behaviour.",
options:[
"A) I am not",
"B) accustomed with",
"C) such rude",
"D) No error"
],
answer:1,
explanation:"Correct preposition is 'accustomed to'."
}
];

let index=0;

function loadQuestion(){
    const q=questions[index];
    document.getElementById("question").innerText=q.q;
    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q=questions[index];
    const opts=document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });

    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length){
        loadQuestion();
    }else{
        document.getElementById("card").innerHTML=
        "<h2>🎉 Quiz Completed!</h2><p>You have finished Spotting Errors.</p>";
    }
}

function prevQuestion(){
    if(index>0){index--;loadQuestion();}
}

loadQuestion();
</script>

</body>
</html>
