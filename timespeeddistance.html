<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Time, Speed & Distance Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:800px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
    animation:fadeIn 0.6s ease;
}
@keyframes fadeIn{
    from{opacity:0;transform:translateY(20px);}
    to{opacity:1;transform:translateY(0);}
}
.question{
    font-size:19px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
    transition:0.3s;
}
.option:hover{
    background:#f1f5f9;
    transform:scale(1.01);
}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{ q:"1) A car travels 60 km in 1 hour. What is its speed?",
  options:["50 km/hr","60 km/hr","70 km/hr","80 km/hr"],
  answer:1,
  explanation:"Speed = Distance ÷ Time = 60 ÷ 1 = 60 km/hr"
},
{ q:"2) A train covers 120 km in 2 hours. Find speed.",
  options:["40","50","60","70"],
  answer:2,
  explanation:"120 ÷ 2 = 60 km/hr"
},
{ q:"3) A man walks at 5 km/hr. Distance in 3 hours?",
  options:["10","15","20","25"],
  answer:1,
  explanation:"5 × 3 = 15 km"
},
{ q:"4) A car runs at 40 km/hr. Time to cover 120 km?",
  options:["2 hr","3 hr","4 hr","5 hr"],
  answer:1,
  explanation:"120 ÷ 40 = 3 hours"
},
{ q:"5) Speed in m/s of 36 km/hr?",
  options:["5","8","10","12"],
  answer:2,
  explanation:"36 × 5/18 = 10 m/s"
},
{ q:"6) Speed in km/hr of 10 m/s?",
  options:["18","36","54","72"],
  answer:1,
  explanation:"10 × 18/5 = 36 km/hr"
},
{ q:"7) A train 150 m long passes a pole in 15 sec. Speed?",
  options:["30","36","40","45"],
  answer:1,
  explanation:"(150 ÷ 15) × 18/5 = 36 km/hr"
},
{ q:"8) A man runs at 6 km/hr. Distance in 30 minutes?",
  options:["2","3","4","5"],
  answer:1,
  explanation:"30 min = 0.5 hr → 6 × 0.5 = 3 km"
},
{ q:"9) A cyclist covers 45 km in 3 hours. Speed?",
  options:["10","12","15","18"],
  answer:2,
  explanation:"45 ÷ 3 = 15 km/hr"
},
{ q:"10) A bus travels at 54 km/hr. Speed in m/s?",
  options:["10","12","15","18"],
  answer:2,
  explanation:"54 × 5/18 = 15 m/s"
},
{ q:"11) A train crosses a man in 10 sec at 72 km/hr. Length?",
  options:["100","150","200","250"],
  answer:2,
  explanation:"72 km/hr = 20 m/s → 20 × 10 = 200 m"
},
{ q:"12) A car travels 90 km at 45 km/hr. Time taken?",
  options:["1 hr","2 hr","3 hr","4 hr"],
  answer:1,
  explanation:"90 ÷ 45 = 2 hours"
},
{ q:"13) Distance in 2 hrs at 25 km/hr?",
  options:["40","45","50","55"],
  answer:2,
  explanation:"25 × 2 = 50 km"
},
{ q:"14) Speed of train crossing 300 m bridge in 30 sec?",
  options:["18","24","36","54"],
  answer:2,
  explanation:"(300 ÷ 30) × 18/5 = 36 km/hr"
},
{ q:"15) A person walks 4 km in 40 min. Speed?",
  options:["4","5","6","7"],
  answer:2,
  explanation:"40 min = 2/3 hr → 4 ÷ (2/3) = 6 km/hr"
},
{ q:"16) Time to cover 100 km at 50 km/hr?",
  options:["1","2","3","4"],
  answer:1,
  explanation:"100 ÷ 50 = 2 hours"
},
{ q:"17) A train moves at 90 km/hr. Speed in m/s?",
  options:["20","25","30","35"],
  answer:1,
  explanation:"90 × 5/18 = 25 m/s"
},
{ q:"18) Distance in 1.5 hrs at 40 km/hr?",
  options:["40","50","60","70"],
  answer:2,
  explanation:"40 × 1.5 = 60 km"
},
{ q:"19) Speed = 20 m/s. Convert to km/hr.",
  options:["36","54","72","90"],
  answer:2,
  explanation:"20 × 18/5 = 72 km/hr"
},
{ q:"20) A train travels 180 km in 3 hrs. Speed?",
  options:["40","50","60","70"],
  answer:2,
  explanation:"180 ÷ 3 = 60 km/hr"
}
];

let index = 0;

function loadQuestion(){
    const q = questions[index];
    document.getElementById("question").innerText = q.q;
    const optDiv = document.getElementById("options");
    optDiv.innerHTML = "";
    document.getElementById("explanation").style.display = "none";
    document.getElementById("nextBtn").style.display = "none";
    document.getElementById("explainBtn").style.display = "none";
    document.getElementById("prevBtn").disabled = index === 0;

    q.options.forEach((opt,i)=>{
        const d = document.createElement("div");
        d.className = "option";
        d.innerText = opt;
        d.onclick = ()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q = questions[index];
    const opts = document.querySelectorAll(".option");

    opts.forEach((o,idx)=>{
        o.onclick = null;
        if(idx === q.answer) o.classList.add("correct");
    });

    if(i !== q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText = q.explanation;
    document.getElementById("nextBtn").style.display = "inline-block";
    document.getElementById("explainBtn").style.display = "inline-block";
}

function toggleExplanation(){
    const e = document.getElementById("explanation");
    e.style.display = e.style.display === "none" ? "block" : "none";
}

function nextQuestion(){
    index++;
    if(index < questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished all questions.</p>";
}

function prevQuestion(){
    if(index > 0){
        index--;
        loadQuestion();
    }
}

loadQuestion();
</script>

</body>
</html>
