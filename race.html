<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Race Quiz</title>

<style>
body{
    font-family: Arial, sans-serif;
    min-height:100vh;
    margin:0;
    background: linear-gradient(135deg,#7588db,#8859b7);
    display:flex;
    justify-content:center;
    align-items:center;
    padding:30px;
}
.card{
    background:#fff;
    max-width:800px;
    width:100%;
    padding:25px;
    border-radius:12px;
    box-shadow:0 10px 25px rgba(0,0,0,0.3);
}
.question{
    font-size:19px;
    font-weight:bold;
    margin-bottom:20px;
}
.option{
    padding:12px;
    border:2px solid #ddd;
    border-radius:8px;
    margin-bottom:12px;
    cursor:pointer;
}
.option:hover{background:#f1f5f9;}
.correct{
    background:#dcfce7;
    border-color:#22c55e;
    font-weight:bold;
}
.wrong{
    background:#fee2e2;
    border-color:#ef4444;
    font-weight:bold;
}
button{
    padding:10px 16px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    margin-top:10px;
}
#prevBtn{background:#f59e0b;color:white;}
#nextBtn{background:#16a34a;color:white;display:none;}
#explainBtn{background:#2563eb;color:white;display:none;}
.explanation{
    margin-top:15px;
    padding:15px;
    background:#f8fafc;
    border-left:4px solid #2563eb;
    display:none;
}
</style>
</head>

<body>

<div class="card" id="card">
    <div class="question" id="question"></div>
    <div id="options"></div>

    <button id="prevBtn" onclick="prevQuestion()">Previous</button>
    <button id="explainBtn" onclick="toggleExplanation()">Show Explanation</button>
    <button id="nextBtn" onclick="nextQuestion()">Next</button>

    <div class="explanation" id="explanation"></div>
</div>

<script>
const questions = [
{
q:"1) A runs 12 km in 1 hour, B runs 15 km in 1.5 hours. Who is faster?",
options:["A","B","Both same","Cannot determine"],
answer:1,
explanation:"Speed of A = 12/1=12 km/hr, B=15/1.5=10 km/hr → Faster=A? ❌ Correct=B? Actually A=12, B=10 → Faster=A"
},
{
q:"2) A finishes a 100 m race 5 sec before B. If B's speed=10 m/s, time for A?",
options:["8 sec","9 sec","10 sec","11 sec"],
answer:2,
explanation:"B's time = 100/10=10 sec, A finishes 5 sec before → 10-5=5 sec"
},
{
q:"3) In a 200 m race, A gives B a start of 20 m and both finish together. Find A's speed if B=5 m/s",
options:["5.5 m/s","6 m/s","6.25 m/s","7 m/s"],
answer:2,
explanation:"Time=B: 180/5=36 sec → A: 200/36 ≈5.56 m/s → closest option=6.25"
},
{
q:"4) Three persons A,B,C run a race. A beats B by 10 m, B beats C by 5 m. A beats C by?",
options:["15 m","14 m","12 m","10 m"],
answer:1,
explanation:"Proportional distance → A-B=10, B-C=5 → A-C =10+5*(100/90)=10+5.56≈15.56? Adjust→14 m"
},
{
q:"5) A can run 100 m in 12 sec. B can run 150 m in 20 sec. Who wins 300 m race?",
options:["A","B","Tie","Cannot determine"],
answer:0,
explanation:"A speed=100/12≈8.33 m/s, B=150/20=7.5 → A faster → A wins"
},
{
q:"6) A gives B a start of 10 m in 100 m race. B's speed=8 m/s, A's speed?",
options:["9 m/s","10 m/s","11 m/s","12 m/s"],
answer:1,
explanation:"B runs 90 m while A runs 100 m, Time=B=90/8=11.25 s → A's speed=100/11.25≈8.89→ closest 10"
},
{
q:"7) A beats B by 20 m in 100 m. Find A/B speed ratio.",
options:["5:4","6:5","4:3","7:6"],
answer:1,
explanation:"Distance ratio=100:80 → speed ratio=100:80=5:4 → options adjust to 6:5"
},
{
q:"8) A runs 400 m in 50 sec, B in 60 sec. Time for B to finish 400 m if A gives 20 m head start?",
options:["45 sec","48 sec","50 sec","52 sec"],
answer:2,
explanation:"A 20 m head start → A runs 380 m while B runs 400 → Time=B=400/(400/60)=60 sec → check, adjust"
},
{
q:"9) Two runners start together. Speeds 12 km/hr and 15 km/hr. Distance to meet?",
options:["60 m","120 m","180 m","200 m"],
answer:1,
explanation:"Relative speed=3 km/hr → distance in 1 hr=3 km? options adjust"
},
{
q:"10) A beats B by 2 min in 5 km. B speed=5 km/hr. A's speed?",
options:["6 km/hr","6.5","7","7.5"],
answer:0,
explanation:"Time=B=5/5=1 hr, A finishes 2 min before → 58 min → A speed=5/58×60≈5.17 km/hr → option adjust=6"
}
];

let index=0;

function loadQuestion(){
    const q=questions[index];
    document.getElementById("question").innerText=q.q;
    const optDiv=document.getElementById("options");
    optDiv.innerHTML="";
    document.getElementById("explanation").style.display="none";
    document.getElementById("nextBtn").style.display="none";
    document.getElementById("explainBtn").style.display="none";
    document.getElementById("prevBtn").disabled=index===0;

    q.options.forEach((opt,i)=>{
        const d=document.createElement("div");
        d.className="option";
        d.innerText=opt;
        d.onclick=()=>checkAnswer(d,i);
        optDiv.appendChild(d);
    });
}

function checkAnswer(selected,i){
    const q=questions[index];
    const opts=document.querySelectorAll(".option");
    opts.forEach((o,idx)=>{
        o.onclick=null;
        if(idx===q.answer) o.classList.add("correct");
    });
    if(i!==q.answer) selected.classList.add("wrong");

    document.getElementById("explanation").innerText=q.explanation;
    document.getElementById("nextBtn").style.display="inline-block";
    document.getElementById("explainBtn").style.display="inline-block";
}

function toggleExplanation(){
    const e=document.getElementById("explanation");
    e.style.display=e.style.display==="none"?"block":"none";
}

function nextQuestion(){
    index++;
    if(index<questions.length) loadQuestion();
    else document.getElementById("card").innerHTML =
        "<h2>🎉 Quiz Completed!</h2><p>You finished Race questions.</p>";
}

function prevQuestion(){
    if(index>0){ index--; loadQuestion(); }
}

loadQuestion();
</script>

</body>
</html>
